{% for field in form %}
  {% if field.is_hidden %}
    {{ field }}
  {% else %}
    <div class="account-field{% if field.errors %} field-invalid{% endif %}{% if field.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
    </div>
  {% endif %}
{% endfor %}
{% for error in form.non_field_errors %}<div class="form-error-summary">{{ error }}</div>{% endfor %}
